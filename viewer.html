<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Pariksha Sarathi Notes</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Vibration rokhne ke liye overflow hidden */
        html, body { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: transparent; overflow: hidden; 
            touch-action: none; /* Turn.js ke sath conflict rokhne ke liye */
        }
        
        body { display: flex; justify-content: center; align-items: center; }

        /* Zoom hone par scroll chalu karne ke liye wrapper */
        #main-wrapper {
            width: 100%; height: 100%; overflow: auto;
            display: flex; justify-content: center; align-items: center;
            -webkit-overflow-scrolling: touch;
        }

        #flipbook { 
            box-shadow: 0 0 15px rgba(0,0,0,0.2); 
            transition: transform 0.2s ease-out;
            transform-origin: center center;
        }
        
        .page { background-color: white; }
        .page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* Buttons Design */
        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            font-size: 24px; color: #fff; background: rgba(0, 0, 0, 0.4);
            border: none; border-radius: 50%; width: 45px; height: 45px;
            cursor: pointer; z-index: 1000; display: flex; justify-content: center; align-items: center;
            backdrop-filter: blur(2px);
        }
        #prev-btn { left: 8px; }
        #next-btn { right: 8px; }

        /* Top Zoom Bar */
        .zoom-bar {
            position: fixed; top: 12px; right: 12px;
            background: rgba(0, 0, 0, 0.8); border-radius: 25px;
            display: flex; padding: 4px 10px; z-index: 1001; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .zoom-btn { background: transparent; border: none; color: white; font-size: 22px; width: 35px; height: 35px; cursor: pointer; }
        #zoom-text { color: white; font-size: 13px; font-weight: bold; margin: 0 10px; min-width: 40px; text-align: center; }
    </style>
</head>

        <button id="zoom-out" class="zoom-btn">−</button>
        <span id="zoom-text">100%</span>
        <button id="zoom-in" class="zoom-btn">+</button>

    <script>
        $(window).on('load', function() {
            var winW = $(window).width();
            var winH = $(window).height();
            var isMobile = winW < 600;

            // Resize logic
            var bookW = isMobile ? winW - 10 : 800;
            var bookH = isMobile ? (winH * 0.75) : 500;

            var book = $("#flipbook");
            book.turn({
                width: bookW, height: bookH,
                display: isMobile ? 'single' : 'double', 
                autoCenter: true,
                duration: 1000
            });

            // Nav
            $("#next-btn").on('click', function() { book.turn("next"); });
            $("#prev-btn").on('click', function() { book.turn("previous"); });

            // Premium Zoom Logic
            var zoomScale = 1;
            function applyZoom() {
                $("#flipbook").css("transform", "scale(" + zoomScale + ")");
                $("#zoom-text").text(Math.round(zoomScale * 100) + "%");
                
                if(zoomScale > 1) {
                    $("body").css("overflow", "auto");
                    $("#main-wrapper").css("align-items", "flex-start");
                } else {
                    $("body").css("overflow", "hidden");
                    $("#main-wrapper").css("align-items", "center");
                    window.scrollTo(0, 0);
                }
            }

            $("#zoom-in").on('click', function() { zoomScale += 0.25; applyZoom(); });
            $("#zoom-out").on('click', function() { if (zoomScale > 1) { zoomScale -= 0.25; applyZoom(); } });

            // Tap to turn (Only when not zoomed)
            book.on('mousedown touchstart', function() {
                if(zoomScale > 1) return;
            });
        });
    </script>
