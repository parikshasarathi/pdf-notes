<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pariksha Sarathi Notes</title>
    <link href="https://unpkg.com/@dearflip/pdfjs-flipbook@1.0.12/dflip/css/dflip.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@dearflip/pdfjs-flipbook@1.0.12/dflip/css/themify-icons.min.css" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; overflow: hidden; }
    </style>
</head>
<body>
    
    <div id="my_book" style="height: 100vh; width: 100vw;"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    
    <script>
        var dFlipLocation = "https://unpkg.com/@dearflip/pdfjs-flipbook@1.0.12/dflip/";
    </script>
    
    <script src="https://unpkg.com/@dearflip/pdfjs-flipbook@1.0.12/dflip/js/dflip.min.js"></script>
    
    <script>
        $(document).ready(function () {
            // Aapka PDF Link
            var pdfLink = "https://cdn.jsdelivr.net/gh/parikshasarathi/pdf-notes/science-notes.pdf";
            
            // Book Load karne ka final command
            $("#my_book").flipBook(pdfLink, {
                webgl: true,
                backgroundColor: "#1a1a1a"
            });
        });
    </script>
</body>
</html>
