    <title>Pariksha Sarathi Official</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #fdfdfd; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
        
        #main-viewport { width: 100%; height: calc(100% - 55px); overflow: auto; display: flex; justify-content: center; align-items: center; -webkit-overflow-scrolling: touch; }
        #flipbook-wrapper { transition: transform 0.2s ease-out; transform-origin: top center; }
        #flipbook { box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .page { background-color: white; }
        .page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }

        /* GSEB Style Premium Toolbar */
        #gseb-toolbar {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 55px;
            background: #ffffff; border-top: 1px solid #e0e0e0;
            display: flex; justify-content: space-evenly; align-items: center; z-index: 1000;
        }

        .tool-btn {
            background: transparent; border: none; padding: 10px;
            cursor: pointer; color: #666; display: flex; justify-content: center; align-items: center;
        }
        /* SVG Icons Style */
        .tool-btn svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
        .tool-btn:active { color: #000; }
        
        #page-info { font-size: 14px; color: #555; font-weight: 500; letter-spacing: 1px; }

        /* GSEB Style Thin Side Arrows */
        .side-btn {
            position: fixed; top: 45%; background: transparent; border: none; 
            color: #999; cursor: pointer; z-index: 500; padding: 10px; width: 50px; height: 80px;
            display: flex; justify-content: center; align-items: center;
        }
        .side-btn svg { width: 35px; height: 50px; stroke: #999; stroke-width: 1; fill: none; }
        #side-prev { left: 0; }
        #side-next { right: 0; }
    </style>
</head>

    <div id="gseb-toolbar">
        <button id="bar-prev" class="tool-btn">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        
        <span id="page-info">1 / 15</span>
        
        <button id="bar-next" class="tool-btn">
            <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>

        <button id="bar-zoom-out" class="tool-btn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>

        <button id="bar-zoom-in" class="tool-btn">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
        </button>

        <button id="bar-fullscreen" class="tool-btn">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
    </div>

    <script>
        $(window).on('load', function() {
            var winW = $(window).width();
            var winH = $("#main-viewport").height(); 
            var isMobile = winW < 600;

            var flipbook = $("#flipbook");
            
            // Kitaab Setup
            flipbook.turn({
                width: isMobile ? winW : 800, // Mobile me full width use karega
                height: isMobile ? (winH * 0.85) : 500, // Thodi zyada height
                display: isMobile ? 'single' : 'double',
                autoCenter: true,
                duration: 1000
            });

            // Page Info
            flipbook.bind("turning", function(event, page, view) {
                var total = flipbook.turn("pages");
                var pageString = isMobile ? page : (view[0] == 0 ? view[1] : view[0] + "-" + view[1]);
                $("#page-info").text(pageString + " / " + total);
            });

            // Buttons Logic
            $("#side-next, #bar-next").click(function() { flipbook.turn("next"); });
            $("#side-prev, #bar-prev").click(function() { flipbook.turn("previous"); });

            // Zoom Control
            var scale = 1;
            function updateZoom() {
                $("#flipbook-wrapper").css("transform", "scale(" + scale + ")");
            }
            $("#bar-zoom-in").click(function() { scale += 0.3; updateZoom(); });
            $("#bar-zoom-out").click(function() { if (scale > 1) { scale -= 0.3; updateZoom(); } });

            // Fullscreen
            $("#bar-fullscreen").click(function() {
                var elem = document.documentElement;
                if (!document.fullscreenElement) {
                    elem.requestFullscreen().catch(err => {});
                } else {
                    document.exitFullscreen();
                }
            });

            // Pinch to Zoom
            var lastScale = 1;
            var startX = 0;
            document.getElementById('main-viewport').addEventListener('touchstart', function(e) {
                if (e.touches.length === 2) {
                    startX = Math.sqrt(Math.pow(e.touches[1].pageX - e.touches[0].pageX, 2) + Math.pow(e.touches[1].pageY - e.touches[0].pageY, 2));
                    lastScale = scale;
                }
            });
            document.getElementById('main-viewport').addEventListener('touchmove', function(e) {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    var dist = Math.sqrt(Math.pow(e.touches[1].pageX - e.touches[0].pageX, 2) + Math.pow(e.touches[1].pageY - e.touches[0].pageY, 2));
                    scale = Math.min(Math.max(1, lastScale * (dist / startX)), 3);
                    updateZoom();
                }
            }, { passive: false });
        });
    </script>
