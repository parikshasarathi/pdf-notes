    <style>
        /* Body me thoda change kiya hai taaki zoom karne par page scroll ho sake */
        body { background-color: #f4f4f4; margin: 0; padding: 0; height: 100vh; overflow: hidden; user-select: none; display: flex; align-items: center; justify-content: center; }
        
        #book-wrapper { width: 100%; height: 100%; overflow: auto; display: flex; align-items: center; justify-content: center; }
        
        #flipbook { box-shadow: 0 0 15px rgba(0,0,0,0.3); transition: transform 0.3s ease; } /* Transition for smooth zoom */
        .page { background-color: white; cursor: pointer; }
        .page img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        
        /* Next/Prev Buttons */
        .nav-btn { 
            position: fixed; top: 50%; transform: translateY(-50%); 
            font-size: 24px; color: black; background: white; 
            border: 2px solid #ccc; border-radius: 50%; width: 40px; height: 40px; 
            cursor: pointer; z-index: 100; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #prev-btn { left: 10px; }
        #next-btn { right: 10px; }
        .nav-btn:hover { background: #e0e0e0; }

        /* Naye Zoom Buttons ka Design */
        .zoom-btn {
            position: fixed; top: 15px; z-index: 100;
            font-size: 20px; font-weight: bold; color: white; background: #2b50c7; 
            border: none; border-radius: 5px; width: 40px; height: 40px; 
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex; justify-content: center; align-items: center;
        }
        #zoom-in { right: 65px; }
        #zoom-out { right: 15px; }
        .zoom-btn:hover { background: #1a368f; }
    </style>
</head>

    <script>
        $(window).on('load', function() {
            var w = $(window).width();
            var h = $(window).height();
            var isMobile = w < 600;

            // 1. Book Setup
            var book = $("#flipbook");
            book.turn({
                width: isMobile ? w - 60 : 800, 
                height: isMobile ? h - 40 : 500,
                display: isMobile ? 'single' : 'double', 
                autoCenter: true,
                elevation: 50,
                gradients: true,
                acceleration: true, 
                duration: 1200      
            });

            // 2. Nav Buttons Logic
            $("#next-btn").click(function() { book.turn("next"); });
            $("#prev-btn").click(function() { book.turn("previous"); });

            // 3. Zoom Logic (Naya Feature)
            var currentZoom = 1;
            
            $("#zoom-in").click(function() {
                currentZoom += 0.5; // Zoom badao
                book.css({
                    "transform": "scale(" + currentZoom + ")",
                    "transform-origin": "top center"
                });
                $("body").css("align-items", "flex-start"); // Upar se scroll ho sake
            });

            $("#zoom-out").click(function() {
                if (currentZoom > 1) {
                    currentZoom -= 0.5; // Zoom kam karo
                    book.css({
                        "transform": "scale(" + currentZoom + ")",
                        "transform-origin": "top center"
                    });
                    
                    if (currentZoom === 1) {
                        $("body").css("align-items", "center"); // Wapas center me lao
                    }
                }
            });

            // 4. Tap karke page palatna
            book.on("click", function(e) {
                // Agar zoom in hai, toh click par page palatne se rokein taaki aaram se scroll ho sake
                if(currentZoom > 1) return; 

                var bookOffset = $(this).offset();
                var clickPosition = e.pageX - bookOffset.left;
                
                if (clickPosition > $(this).width() / 2) {
                    book.turn("next");
                } else {
                    book.turn("previous");
                }
            });

            // 5. Keyboard Navigation
            $(document).keydown(function(e){
                if (e.keyCode == 37) { book.turn("previous"); }
                else if (e.keyCode == 39) { book.turn("next"); }
            });
        });
    </script>
